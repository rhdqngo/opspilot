name: PR checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile and install
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
      - name: Validate synthetic knowledge corpus
        run: uv run opspilot knowledge validate --format summary
      - name: Run deterministic knowledge smoke
        run: uv run opspilot knowledge smoke --backend local --env dev --format summary
      - name: Run fixture evidence smoke
        run: uv run opspilot evidence smoke --backend fixture --scenario SCN-001 --env dev --format summary
      - name: Build
        run: uv build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable-target demo image
        run: docker build --platform linux/amd64 -t opspilot-demo:local .
      - name: Start three local service roles
        run: docker compose up -d --no-build
      - name: Wait for order readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8100/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run bounded container E2E
        run: >-
          docker compose exec -T
          -e OPSPILOT_ORDER_URL=http://127.0.0.1:8080
          order opspilot demo load --orders 10 --concurrency 2 --auth local
      - name: Replay bounded SCN-001 three times
        shell: bash
        run: |
          for attempt in 1 2 3; do
            docker compose exec -T \
              -e OPSPILOT_ORDER_URL=http://127.0.0.1:8080 \
              order opspilot scenario run --scenario SCN-001 --auth local --format json
          done
      - name: Stop local service roles
        if: always()
        run: docker compose down --remove-orphans
