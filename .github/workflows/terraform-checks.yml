name: Terraform checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/terraform/bootstrap
          - infra/terraform/environments/dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: v0.64.0
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without backend
        run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.directory }} validate
      - name: Run mock-provider tests
        run: terraform -chdir=${{ matrix.directory }} test
      - name: Lint
        run: tflint --chdir=${{ matrix.directory }} --config="${{ github.workspace }}/.tflint.hcl"
