name: Terraform plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dev-plan:
    if: ${{ vars.TF_PLAN_ENABLED == 'true' && vars.TF_M2_IMAGE_READY == 'true' && vars.TF_M3_IMAGE_READY == 'true' && vars.TF_M4_KNOWLEDGE_READY == 'true' && vars.TF_M5_LIVE_EVIDENCE_READY == 'true' && vars.TF_M7_RUNTIME_READY == 'true' && vars.TF_M8_REMEDIATION_READY == 'true' && vars.TF_PERSISTENT_INVESTIGATIONS_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_budget_notification_email: ${{ secrets.GCP_BUDGET_NOTIFICATION_EMAIL }}
      TF_VAR_deploy_demo: "true"
      TF_VAR_demo_image_uri: ${{ secrets.GCP_DEMO_IMAGE_URI }}
      TF_VAR_enable_scenarios: "true"
      TF_VAR_deploy_knowledge: "true"
      TF_VAR_search_location: "global"
      TF_VAR_enable_live_evidence: "true"
      TF_VAR_investigator_operator_email: ${{ secrets.GCP_INVESTIGATOR_OPERATOR_EMAIL }}
      TF_VAR_deploy_agent_runtime: "true"
      TF_VAR_enable_persistent_investigations: "true"
      TF_VAR_investigation_image_uri: ${{ secrets.GCP_INVESTIGATION_IMAGE_URI }}
      TF_VAR_enable_remediation: "true"
      TF_VAR_remediation_image_uri: ${{ secrets.GCP_REMEDIATION_IMAGE_URI }}
      TF_VAR_remediation_approver_group: ${{ secrets.GCP_REMEDIATION_APPROVER_GROUP }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      OPSPILOT_REDACT_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      OPSPILOT_REDACT_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      OPSPILOT_REDACT_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      OPSPILOT_REDACT_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      OPSPILOT_REDACT_BUDGET_EMAIL: ${{ secrets.GCP_BUDGET_NOTIFICATION_EMAIL }}
      OPSPILOT_REDACT_INVESTIGATOR_OPERATOR_EMAIL: ${{ secrets.GCP_INVESTIGATOR_OPERATOR_EMAIL }}
      OPSPILOT_REDACT_DEMO_IMAGE_URI: ${{ secrets.GCP_DEMO_IMAGE_URI }}
      OPSPILOT_REDACT_INVESTIGATION_IMAGE_URI: ${{ secrets.GCP_INVESTIGATION_IMAGE_URI }}
      OPSPILOT_REDACT_REMEDIATION_IMAGE_URI: ${{ secrets.GCP_REMEDIATION_IMAGE_URI }}
      OPSPILOT_REDACT_REMEDIATION_APPROVER_GROUP: ${{ secrets.GCP_REMEDIATION_APPROVER_GROUP }}
      OPSPILOT_REDACT_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      OPSPILOT_REDACT_TERRAFORM_PLAN_SERVICE_ACCOUNT: ${{ secrets.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
      - name: Build deterministic runtime source
        shell: bash
        run: |
          uv sync --frozen --extra agent
          uv run --extra agent opspilot agent runtime package \
            --output "$RUNNER_TEMP/m7-runtime" >/dev/null
          archive="$RUNNER_TEMP/m7-runtime/opspilot-agent-runtime.tar.gz"
          printf 'TF_VAR_agent_runtime_source_archive=%s\n' \
            "$(base64 -w0 "$archive")" >> "$GITHUB_ENV"
          printf 'TF_VAR_agent_runtime_source_sha256=%s\n' \
            "$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Authenticate with read-only WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}
      - name: Initialize before the first dev state
        if: ${{ vars.TF_DEV_STATE_READY != 'true' }}
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false -input=false
      - name: Initialize remote state
        if: ${{ vars.TF_DEV_STATE_READY == 'true' }}
        shell: bash
        run: |
          cp infra/terraform/environments/dev/backend.tf.example \
            infra/terraform/environments/dev/backend.tf
          printf 'bucket = "%s"\n' "$TF_STATE_BUCKET" > "$RUNNER_TEMP/backend.hcl"
          terraform -chdir=infra/terraform/environments/dev init \
            -lock=false \
            -input=false \
            -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Create read-only plan
        shell: bash
        run: |
          raw_log="$RUNNER_TEMP/terraform-plan-raw.txt"
          set +e
          terraform -chdir=infra/terraform/environments/dev plan \
            -no-color \
            -input=false \
            -lock=false \
            -out="$RUNNER_TEMP/opspilot.tfplan" \
            >"$raw_log" 2>&1
          plan_status=$?
          set -e
          PYTHONPATH=src python -m opspilot.plan_redaction < "$raw_log"
          rm -f "$raw_log"
          if (( plan_status != 0 )); then
            exit "$plan_status"
          fi
          terraform -chdir=infra/terraform/environments/dev show \
            -no-color "$RUNNER_TEMP/opspilot.tfplan" \
            | PYTHONPATH=src python -m opspilot.plan_redaction \
            > "$RUNNER_TEMP/terraform-plan.txt"
      - name: Upload redacted text plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-plan-redacted
          path: ${{ runner.temp }}/terraform-plan.txt
          if-no-files-found: error
          retention-days: 7
